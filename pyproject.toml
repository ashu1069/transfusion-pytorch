[project]
name = "transfusion-pytorch"
version = "0.14.5"
description = "Transfusion in Pytorch"

readme = "README.md"
requires-python = ">= 3.10, < 3.14"
license = { file = "LICENSE" }
keywords = [
    'artificial intelligence',
    'deep learning',
    'transformers',
    'attention mechanism',
    'rectified flow',
  ]
classifiers=[
    'Development Status :: 4 - Beta',
    'Intended Audience :: Developers',
    'Topic :: Scientific/Engineering :: Artificial Intelligence',
    'License :: OSI Approved :: MIT License',
    'Programming Language :: Python :: 3.8',
  ]

dependencies = [
    'axial-positional-embedding>=0.3.5',
    'beartype',
    'einx>=0.3.0',
    'einops>=0.8.0',
    'ema-pytorch',
    'jaxtyping',
    'loguru',
    'rotary_embedding_torch>=0.8.4',
    'torchdiffeq',
    'torch>=2.0',
    'tqdm',
    # Audio dependencies
    'datasets',        # Without [audio] extra to avoid torchcodec
    'soundfile',       # Audio decoder (used by datasets automatically)
    'librosa',         # Audio processing (soundfile backend)
    'torchaudio',
    'wandb',
    'matplotlib',
    'vocos',           # Neural vocoder for high-quality mel → audio
]

[project.urls]
Homepage = "https://pypi.org/project/transfusion-pytorch/"
Repository = "https://github.com/lucidrains/transfusion-pytorch"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]

examples = [
    "adam-atan2-pytorch>=0.2.2",
    "datasets",
    "diffusers"
]

audio = [
    "datasets[audio]",
    "torchaudio",
    "soundfile",
    "wandb",
    "matplotlib",
]

test = [
    "pytest",
]

[tool.ruff]
line-length = 1000

lint.ignore = [
    "F722", # for jaxtyping shape annotation
    "F401",
    "F821",
    "E402"
]

[tool.pytest.ini_options]
pythonpath = [
    "."
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["transfusion_pytorch"]
